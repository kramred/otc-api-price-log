name: Daily OTC API pricing check and update repo on changes

# Controls when the workflow will run
on:
  schedule:
  - cron: "0 3 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write         # GITHUB_TOKEN needs write to push back

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  pollAPI:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out repository under $GITHUB_WORKSPACE, so jobs can access it
      - name: Checkout
        uses: actions/checkout@v4
        
      # Runs the script to fetch current API resoponse and compare to last data stored (keep if changed)
      - name: Fetch current API response and keep files if changes are present
        run: ./get-otc-price-api-response.sh